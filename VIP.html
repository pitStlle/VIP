<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">

  <title>密码验证 · 首页</title>

  <style>

    /* 全局重置与字体 */

    * {

      margin: 0;

      padding: 0;

      box-sizing: border-box;

    }



    body {

      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;

      background: linear-gradient(145deg, #f5f7fa 0%, #e6ecf5 100%);

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 1.5rem;

      margin: 0;

      /* 移动端点击无高亮 */

      -webkit-tap-highlight-color: transparent;

    }



    /* 卡片容器 – 适配手机，最大宽度420px，柔和阴影 */

    .password-card {

      width: 100%;

      max-width: 420px;

      background: rgba(255, 255, 255, 0.9);

      backdrop-filter: blur(12px);

      -webkit-backdrop-filter: blur(12px);

      border-radius: 2.5rem;

      padding: 2.5rem 1.8rem;

      box-shadow: 0 25px 45px -12px rgba(0, 20, 40, 0.25),

                  0 1px 3px rgba(0, 0, 0, 0.05);

      border: 1px solid rgba(255, 255, 255, 0.5);

      transition: all 0.2s ease;

    }



    /* 锁图标装饰 */

    .lock-icon {

      display: flex;

      justify-content: center;

      margin-bottom: 1.2rem;

      font-size: 3rem;

      filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.05));

      opacity: 0.9;

    }



    h1 {

      font-size: 1.9rem;

      font-weight: 600;

      color: #1e2b3c;

      text-align: center;

      letter-spacing: -0.02em;

      margin-bottom: 0.5rem;

    }



    .subhead {

      text-align: center;

      color: #5f6c80;

      font-size: 0.95rem;

      margin-bottom: 2rem;

      font-weight: 400;

      padding: 0 0.5rem;

      line-height: 1.4;

    }



    /* 输入框容器 */

    .input-group {

      margin-bottom: 1.8rem;

      position: relative;

    }



    /* 密码输入框 */

    .password-input {

      width: 100%;

      padding: 1.1rem 1.2rem;

      font-size: 1.1rem;

      border: 1.5px solid #d0dae8;

      border-radius: 1.8rem;

      background: #ffffff;

      outline: none;

      color: #1e2b3c;

      transition: border-color 0.2s, box-shadow 0.2s;

      /* 防止iOS缩放 */

      font-size: 1rem;

      -webkit-appearance: none;

      appearance: none;

    }



    .password-input:focus {

      border-color: #3b7cff;

      box-shadow: 0 0 0 4px rgba(59, 124, 255, 0.15);

    }



    .password-input::placeholder {

      color: #9aa9bb;

      font-weight: 300;

    }



    /* 按钮样式 */

    .submit-btn {

      width: 100%;

      padding: 1.1rem 1.5rem;

      font-size: 1.1rem;

      font-weight: 600;

      color: white;

      background: linear-gradient(135deg, #2d6eff, #1a4fd8);

      border: none;

      border-radius: 2.5rem;

      cursor: pointer;

      transition: transform 0.15s, box-shadow 0.2s, background 0.2s;

      box-shadow: 0 10px 18px -8px rgba(26, 79, 216, 0.4);

      letter-spacing: 0.01em;

      -webkit-tap-highlight-color: transparent;

      /* 确保按钮可点击区域足够大 */

      touch-action: manipulation;

    }



    .submit-btn:active {

      transform: scale(0.97);

      background: linear-gradient(135deg, #2358d0, #1540b0);

      box-shadow: 0 5px 12px -5px rgba(26, 79, 216, 0.5);

    }



    .submit-btn:focus-visible {

      outline: 3px solid rgba(59, 124, 255, 0.5);

      outline-offset: 2px;

    }



    /* 错误提示 */

    .error-message {

      color: #d93b3b;

      background: #fff0f0;

      border-radius: 3rem;

      padding: 0.8rem 1.2rem;

      font-size: 0.9rem;

      text-align: center;

      margin-top: -0.8rem;

      margin-bottom: 1rem;

      border: 1px solid #ffcdd2;

      font-weight: 500;

      opacity: 0;

      transform: translateY(-4px);

      transition: opacity 0.2s, transform 0.2s;

      pointer-events: none;

    }



    .error-message.show {

      opacity: 1;

      transform: translateY(0);

    }



    /* 第二界面（默认隐藏） */

    .second-screen {

      display: none;

      text-align: center;

      animation: fadeIn 0.4s ease;

    }



    .second-screen h2 {

      font-size: 2rem;

      color: #1e2b3c;

      margin-bottom: 1rem;

    }



    .second-screen p {

      color: #4f5e72;

      font-size: 1.1rem;

      margin-bottom: 2rem;

      line-height: 1.5;

    }



    .success-badge {

      font-size: 3.5rem;

      margin-bottom: 1rem;

    }



    .back-btn {

      background: transparent;

      border: 1.5px solid #2d6eff;

      color: #2d6eff;

      padding: 0.9rem 2rem;

      border-radius: 2.5rem;

      font-size: 1rem;

      font-weight: 500;

      cursor: pointer;

      transition: background 0.2s, color 0.2s;

      -webkit-tap-highlight-color: transparent;

    }



    .back-btn:active {

      background: rgba(45, 110, 255, 0.1);

    }



    @keyframes fadeIn {

      from { opacity: 0; transform: translateY(6px); }

      to { opacity: 1; transform: translateY(0); }

    }



    /* 对于非常小的屏幕，调整内边距 */

    @media (max-width: 380px) {

      .password-card {

        padding: 2rem 1.3rem;

        border-radius: 2rem;

      }

      h1 {

        font-size: 1.6rem;

      }

      .lock-icon {

        font-size: 2.5rem;

      }

      .password-input {

        padding: 1rem 1rem;

      }

      .submit-btn {

        padding: 1rem 1rem;

      }

    }



    /* 禁止点击时文字选中，提升体验 */

    .password-card, .submit-btn, .back-btn {

      user-select: none;

    }

  </style>

</head>

<body>



  <!-- 密码卡片（第一界面） -->

  <div class="password-card" id="passwordCard">

    <div class="lock-icon">🔐</div>

    <h1>私密访问</h1>

    <div class="subhead">请输入密码以继续</div>



    <div class="input-group">

      <input 

        type="password" 

        id="passwordInput" 

        class="password-input" 

        placeholder="输入密码" 

        autocomplete="off"

        inputmode="text"

        enterkeyhint="go"

        aria-label="密码"

      >

    </div>



    <!-- 错误提示区域（默认隐藏） -->

    <div class="error-message" id="errorMsg" role="alert">

      ⚠️ 密码错误，请重试

    </div>



    <button class="submit-btn" id="submitBtn" aria-label="验证并进入">

      进入 →

    </button>

  </div>



  <!-- 第二界面（初始隐藏） -->

  <div class="second-screen" id="secondScreen">

    <div class="success-badge">✅</div>

    <h2>欢迎回来</h2>

    <p>您已成功进入第二界面。</p>

    <button class="back-btn" id="backBtn" aria-label="返回密码页">

      ← 返回首页

    </button>

  </div>



  <script>

    (function() {

      // ---------- 配置 ----------

      const CORRECT_PASSWORD = '123456';   // 可修改为你想要的密码



      // ---------- 获取DOM元素 ----------

      const passwordCard = document.getElementById('passwordCard');

      const secondScreen = document.getElementById('secondScreen');

      const passwordInput = document.getElementById('passwordInput');

      const submitBtn = document.getElementById('submitBtn');

      const errorMsg = document.getElementById('errorMsg');

      const backBtn = document.getElementById('backBtn');



      // 错误提示定时器

      let errorTimer = null;



      // ---------- 隐藏错误提示（带动画移除）----------

      function hideError() {

        if (errorTimer) {

          clearTimeout(errorTimer);

          errorTimer = null;

        }

        errorMsg.classList.remove('show');

      }



      // ---------- 显示错误提示 ----------

      function showError() {

        // 先清除之前的定时器与状态，重新触发显示

        if (errorTimer) {

          clearTimeout(errorTimer);

          errorTimer = null;

        }

        errorMsg.classList.add('show');

        // 3秒后自动隐藏

        errorTimer = setTimeout(() => {

          errorMsg.classList.remove('show');

          errorTimer = null;

        }, 3000);

      }



      // ---------- 切换到第二界面 ----------

      function goToSecondScreen() {

        // 隐藏密码卡片，显示第二界面

        passwordCard.style.display = 'none';

        secondScreen.style.display = 'block';

        // 清除密码输入框内容（安全 & 下次返回时干净）

        passwordInput.value = '';

        // 隐藏错误提示（如果显示着）

        hideError();

      }



      // ---------- 返回第一界面（密码页）----------

      function goToPasswordScreen() {

        secondScreen.style.display = 'none';

        passwordCard.style.display = 'block';

        passwordInput.value = '';      // 清空密码，以防返回时残留

        hideError();

        // 可选：自动聚焦密码框（移动端可能不友好，但保留无妨）

        // 注意：部分移动端浏览器自动聚焦会弹出键盘，根据产品需求决定

        // 为了体验，此处不自动聚焦，用户点击输入框即可

      }



      // ---------- 验证密码 ----------

      function verifyPassword() {

        const entered = passwordInput.value.trim(); // 去除首尾空格



        // 判断密码是否正确（区分大小写，空密码会提示错误）

        if (entered === CORRECT_PASSWORD) {

          // 正确 → 跳转第二界面

          goToSecondScreen();

        } else {

          // 错误 → 显示错误提示，并清空输入框（便于重新输入）

          showError();

          passwordInput.value = '';   // 清空输入框

          // 移动端保持键盘不收起，但输入框已清空，用户可立即重新输入

          passwordInput.focus();      // 聚焦到输入框，方便再次输入

        }

      }



      // ---------- 事件监听 ----------

      // 1. 点击“进入”按钮

      submitBtn.addEventListener('click', function(e) {

        e.preventDefault();  // 防止任何可能的默认行为

        verifyPassword();

      });



      // 2. 在输入框按回车（移动端键盘“前往/确认”键）

      passwordInput.addEventListener('keydown', function(e) {

        if (e.key === 'Enter' || e.keyCode === 13) {

          e.preventDefault();  // 阻止表单默认提交（如果有）

          verifyPassword();

        }

      });



      // 3. 点击“返回首页”按钮 → 回到密码界面

      backBtn.addEventListener('click', function(e) {

        e.preventDefault();

        goToPasswordScreen();

      });



      // 4. 输入框获得焦点时，如果错误提示显示着，可以保留或隐藏（这里选择保留，但点击输入时自动隐藏更清爽？）

      //    更符合直觉：用户开始输入时隐藏错误提示。

      passwordInput.addEventListener('input', function() {

        // 如果错误提示当前显示，用户开始输入就隐藏它（提升体验）

        if (errorMsg.classList.contains('show')) {

          hideError();

        }

      });



      // 5. 防止点击输入框外部失去焦点时键盘收起，但不需要额外操作。确保输入框可正常使用。



      // 6. 页面加载完成后可聚焦输入框 (根据设备/体验权衡，这里不用auto focus，避免移动端键盘立刻弹出)

      // 可根据需要取消下面注释：

      // window.addEventListener('load', function() {

      //   // 仅桌面端聚焦，移动端不自动聚焦以免键盘遮挡

      //   if (window.innerWidth > 768) {

      //     passwordInput.focus();

      //   }

      // });



      // 7. 防止在第二界面时，用户按返回键/浏览器后退导致显示异常，不必额外处理，刷新始终回到密码界面。



      // 附加：处理页面可见性变化等不需要。



      // 确保如果用户从第二界面返回密码界面（按返回键），如果显示状态不对，可以监听popstate? 

      // 但本示例是纯前端单页切换，没有修改url，所以浏览器返回不会影响，无须额外操作。

    })();

  </script>

</body>

</html>
