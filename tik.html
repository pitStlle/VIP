		<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>弹窗示例</title>
    <style>
        /* 页面基础样式（模拟背后的网页） */
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* ================= 弹窗核心样式开始 ================= */

        /* 1. 全屏半透明遮罩层 */
        .modal-overlay {
            position: fixed; /* 固定定位，覆盖全屏 */
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6); /* 黑色半透明背景 */
            display: flex; /* 使用Flex布局使内部卡片居中 */
            justify-content: center;
            align-items: center;
            z-index: 9999; /* 确保在最上层 */
        }

        /* 2. 白色内容卡片 */
        .modal-content {
            background-color: #ffffff;
            width: 85%; /* 移动端适配宽度 */
            max-width: 350px;
            border-radius: 12px; /* 圆角 */
            padding: 30px 20px 20px 20px;
            position: relative; /* 为了定位右上角的关闭按钮 */
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* 3. 顶部绿色横幅 */
        .modal-header-banner {
            position: absolute;
            top: -15px; /* 向上偏移，突出卡片 */
            left: 50%;
            transform: translateX(-50%); /* 水平居中 */
            background: linear-gradient(to right, #22c55e, #16a34a); /* 绿色渐变 */
            color: white;
            padding: 8px 25px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            white-space: nowrap;
        }

        /* 4. 关闭按钮 (右上角 X) */
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 24px;
            height: 24px;
            background-color: #f0f0f0;
            color: #999;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #ddd;
            line-height: 1;
        }

        /* 5. 标签样式 (蓝、红、绿) */
        .tag-title {
            display: inline-block;
            color: white;
            padding: 4px 15px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 10px;
        }
        .tag-blue { background-color: #3b82f6; }
        .tag-red { background-color: #ef4444; }
        .tag-green { background-color: #22c55e; }

        /* 6. 文本列表样式 */
        .info-text {
            color: #333;
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
            text-align: left; /* 文本左对齐 */
            padding: 0 10px;
        }
        /* 关键词标红/变色 */
        .highlight {
            color: #ef4444; /* 红色 */
            font-weight: bold;
        }

        /* 7. 底部大按钮 */
        .action-btn {
            display: block;
            width: 100%;
            background-color: #1d4ed8; /* 蓝色背景 */
            color: white;
            text-align: center;
            padding: 12px 0;
            border-radius: 25px; /* 圆角按钮 */
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            margin-top: 20px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(29, 78, 216, 0.3);
        }

        /* 隐藏状态 */
        .hidden {
            display: none !important;
        }
        /* ================= 弹窗核心样式结束 ================= */
    </style>
</head>
<body>

    <!-- 页面原有内容（模拟） -->
    <div style="padding: 20px; text-align: center; color: #666;">
        <h2>网页背景内容</h2>
        <p>这里是原本的网页内容...</p>
    </div>

    <!-- ================= 弹窗 HTML 结构开始 ================= -->
    <div class="modal-overlay" id="myModal">
        <div class="modal-content">
            <!-- 关闭按钮 -->
            <div class="close-btn" onclick="closeModal()">✕</div>
            
            <!-- 顶部绿色横幅 -->
            <div class="modal-header-banner">新澳密</div>

            <!-- 内容区块 1：蓝色 -->
            <div class="tag-title tag-blue">新澳门六合彩</div>
            <p class="info-text">
                新澳门298期: 34-08-37 开 <span class="highlight">《猪08》准</span><br>
                新澳门297期: 13-27-40 开 <span class="highlight">《马13》准</span><br>
                新澳门296期: 23-43-03 开 <span class="highlight">《猴23》准</span>
            </p>

            <!-- 内容区块 2：红色 -->
            <div class="tag-title tag-red">香港六合彩</div>
            <p class="info-text">
                香港114期: 25-26-20 开 <span class="highlight">《猪20》准</span><br>
                香港113期: 05-11-38 开 <span class="highlight">《虎05》准</span><br>
                香港112期: 31-08-07 开 <span class="highlight">《鼠31》准</span>
            </p>

            <!-- 内容区块 3：绿色 -->
            <div class="tag-title tag-green">澳门六合彩</div>
            <p class="info-text">
                澳门298期: 29-03-41 开 <span class="highlight">《虎29》准</span><br>
                澳门297期: 38-08-15 开 <span class="highlight">《蛇38》准</span><br>
                澳门296期: 43-17-26 开 <span class="highlight">《虎17》准</span>
            </p>

            <!-- 底部按钮 -->
            <button class="action-btn">点击立即领取</button>
        </div>
    </div>
    <!-- ================= 弹窗 HTML 结构结束 ================= -->

    <script>
        // 关闭弹窗的 JavaScript 代码
        function closeModal() {
            document.getElementById('myModal').classList.add('hidden');
        }
    </script>
</body>
</html>
	</body>
</html>
